<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Oracle | Aether Sovereign</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Poppins:wght@300;400;600&family=Orbitron:wght@400;700&family=Fira+Code:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root {
    --gold: #d4af37;
    --gold-bright: #fcf6ba;
    --bg-dark: #050505;
    --glass: rgba(12, 12, 12, 0.9);
    --border: rgba(212, 175, 55, 0.2);
    --ai-bubble: rgba(212, 175, 55, 0.05);
    --user-bubble: rgba(255, 255, 255, 0.03);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: var(--bg-dark);
    color: #fff;
    font-family: 'Poppins', sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 10px;
}
.container {
    width: 100%;
    max-width: 950px;
    height: 95vh;
    background: var(--glass);
    backdrop-filter: blur(50px);
    border-radius: 30px;
    border: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    box-shadow: 0 0 50px rgba(0,0,0,0.5);
    overflow: hidden;
}
header {
    padding: 20px 30px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.oracle-brand h2 {
    font-family: 'Cinzel', serif;
    font-size: clamp(1.2rem, 4vw, 1.6rem);
    letter-spacing: 4px;
    background: linear-gradient(to right, #fff, var(--gold-bright));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}
.status-pill {
    background: rgba(0, 255, 150, 0.05);
    border: 1px solid rgba(0, 255, 150, 0.2);
    padding: 5px 10px;
    border-radius: 50px;
    font-size: 8px;
    letter-spacing: 1px;
    color: #00ff96;
}
#chat-box {
    flex: 1;
    padding: 20px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 20px;
}
.msg {
    max-width: 90%;
    padding: 15px 20px;
    font-size: 14px;
    line-height: 1.6;
}
.ai-msg { align-self: flex-start; background: var(--ai-bubble); border-radius: 0 20px 20px 20px; border-left: 2px solid var(--gold); }
.user-msg { align-self: flex-end; background: var(--user-bubble); border-radius: 20px 20px 0 20px; border: 1px solid rgba(255,255,255,0.05); }
.ai-label { font-family: 'Orbitron', sans-serif; font-size: 8px; color: var(--gold); display: block; margin-bottom: 5px; opacity: 0.6; }
.typing-dots { display: inline-flex; gap: 4px; padding: 4px 0; }
.typing-dots span { width: 6px; height: 6px; background: var(--gold); border-radius: 50%; animation: bounce 1.2s infinite; opacity: 0.6; }
.typing-dots span:nth-child(2) { animation-delay: 0.2s; }
.typing-dots span:nth-child(3) { animation-delay: 0.4s; }
@keyframes bounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-6px)} }
.input-area {
    padding: 20px;
    background: rgba(0,0,0,0.4);
    border-top: 1px solid var(--border);
    display: flex;
    gap: 10px;
}
.input-wrapper {
    flex: 1;
    background: rgba(255,255,255,0.02);
    border: 1px solid var(--border);
    border-radius: 15px;
    padding: 0 15px;
    display: flex;
    align-items: center;
}
#message { width: 100%; padding: 12px 0; background: transparent; border: none; color: #fff; outline: none; font-family: 'Poppins', sans-serif; }
.send-btn { width: 45px; height: 45px; border-radius: 12px; border: none; background: var(--gold); color: #000; cursor: pointer; }
.send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
@media(max-width: 480px) { .container { border-radius: 20px; } .status-pill { display: none; } }
</style>
</head>
<body>
<div class="container">
    <header>
        <div class="oracle-brand"><h2>AI Oracle</h2></div>
        <div class="status-pill">SOVEREIGN_LINK_STABLE</div>
    </header>
    <div id="chat-box">
        <div class="msg ai-msg">
            <span class="ai-label">SYSTEM_INITIALIZED</span>
            Greetings, architect. I am the <b>Aether Oracle</b>. How shall we navigate your path today?
        </div>
    </div>
    <div class="input-area">
        <div class="input-wrapper">
            <input type="text" id="message" placeholder="Input directive..." autocomplete="off">
        </div>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">
            <i class="fas fa-bolt"></i>
        </button>
    </div>
</div>

<script>
const inputField = document.getElementById("message");
const chat = document.getElementById("chat-box");
const sendBtn = document.getElementById("sendBtn");

inputField.addEventListener("keydown", (e) => { if(e.key === "Enter") sendMessage(); });

async function sendMessage() {
    const message = inputField.value.trim();
    if (!message) return;

    // Show user message
    appendMsg("user-msg", message);
    inputField.value = "";
    sendBtn.disabled = true;

    // Show typing indicator
    const typingDiv = document.createElement("div");
    typingDiv.className = "msg ai-msg";
    typingDiv.id = "typing";
    typingDiv.innerHTML = `<span class="ai-label">ORACLE_PROCESSING</span><div class="typing-dots"><span></span><span></span><span></span></div>`;
    chat.appendChild(typingDiv);
    scrollToBottom();

    try {
        const response = await fetch("/chatbot_api", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message })
        });
        const data = await response.json();

        document.getElementById("typing")?.remove();

        const aiDiv = document.createElement("div");
        aiDiv.className = "msg ai-msg";
        aiDiv.innerHTML = `<span class="ai-label">ORACLE_RESPONSE</span><span id="typeTarget"></span>`;
        chat.appendChild(aiDiv);
        scrollToBottom();
        typeText(data.reply, aiDiv.querySelector("#typeTarget"));
    } catch (err) {
        document.getElementById("typing")?.remove();
        appendMsg("ai-msg", "⚠️ Neural link error. Please try again.");
    } finally {
        sendBtn.disabled = false;
    }
}

function appendMsg(cls, text) {
    const div = document.createElement("div");
    div.className = `msg ${cls}`;
    div.textContent = text;
    chat.appendChild(div);
    scrollToBottom();
}

function typeText(text, el) {
    let processed = text.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>');
    let i = 0;
    el.innerHTML = "";
    function tick() {
        if (i < processed.length) {
            if (processed[i] === "<") {
                let end = processed.indexOf(">", i);
                el.innerHTML += processed.substring(i, end + 1);
                i = end + 1;
            } else {
                el.innerHTML += processed[i++];
            }
            setTimeout(tick, 12);
            scrollToBottom();
        }
    }
    tick();
}

function scrollToBottom() { chat.scrollTop = chat.scrollHeight; }
</script>
</body>
</html>
