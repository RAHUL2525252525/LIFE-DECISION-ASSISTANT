<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comparison Oracle | Aether Sovereign</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root {
    --gold: #d4af37;
    --gold-bright: #fcf6ba;
    --bg-dark: #020202;
    --glass: rgba(8, 8, 8, 0.95);
    --border: rgba(212, 175, 55, 0.15);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    background: var(--bg-dark);
    color: #fff;
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    padding: clamp(20px, 5vw, 60px) 20px;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    max-width: 900px;
    width: 100%;
    background: var(--glass);
    border: 1px solid var(--border);
    border-radius: 40px;
    padding: clamp(30px, 5vw, 60px);
}

h2 {
    font-family: 'Cinzel', serif;
    font-size: clamp(1.8rem, 5vw, 2.5rem);
    text-align: center;
    letter-spacing: clamp(4px, 1vw, 10px);
    color: var(--gold-bright);
    margin-bottom: 10px;
    text-transform: uppercase;
}

.tagline { text-align: center; font-size: 10px; letter-spacing: 6px; color: var(--gold); margin-bottom: 40px; }

.input-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 20px;
}

label { font-size: 10px; color: var(--gold); letter-spacing: 2px; margin-bottom: 8px; display: block; }
input, textarea { 
    width: 100%; 
    padding: 15px; 
    border-radius: 12px; 
    border: 1px solid rgba(255,255,255,0.1); 
    background: #000; 
    color: #fff; 
    font-size: 14px; 
}

.btn-oracle {
    margin-top: 25px;
    width: 100%;
    padding: 18px;
    border: none;
    border-radius: 15px;
    background: linear-gradient(135deg, var(--gold-bright), var(--gold));
    font-weight: bold;
    letter-spacing: 3px;
    cursor: pointer;
    text-transform: uppercase;
    transition: 0.3s;
}

.btn-oracle:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(212,175,55,0.2); }

#resultZone { display: none; margin-top: 50px; }
.verdict-box { border: 1px solid var(--gold); padding: clamp(20px, 4vw, 40px); border-radius: 30px; text-align: center; }
.final-label { color: var(--gold); font-size: 10px; letter-spacing: 5px; display: block; margin-bottom: 20px; }

#verdictText {
    white-space: pre-line;
    text-align: left;
    line-height: 1.8;
    font-size: 15px;
    padding: 20px;
    background: rgba(255,255,255,0.03);
    border-radius: 15px;
}

/* Mobile responsiveness */
@media(max-width: 600px) {
    .input-grid { grid-template-columns: 1fr; }
    .container { padding: 25px; border-radius: 25px; }
}
</style>
</head>
<body>

<div class="container">
    <h2>Comparison Oracle</h2>
    <p class="tagline">BINARY_SYNTHESIS_PROTOCOL</p>

    <div class="input-grid">
        <div>
            <label>COMPONENT_ALPHA</label>
            <input id="option1" placeholder="Option A">
        </div>
        <div>
            <label>COMPONENT_BETA</label>
            <input id="option2" placeholder="Option B">
        </div>
    </div>

    <label>GUIDING_GOAL</label>
    <textarea id="myWish" rows="2" placeholder="What is your goal?"></textarea>

    <button class="btn-oracle" onclick="runOracle()">Initiate Synthesis</button>

    <div class="loader" id="loader" style="display:none; text-align:center; margin-top:40px;">
        <i class="fas fa-circle-notch fa-spin" style="font-size:30px; color:var(--gold);"></i>
    </div>

    <div id="resultZone">
        <div class="verdict-box">
            <span class="final-label">AI ANALYSIS</span>
            <div id="verdictText"></div>
        </div>
    </div>
</div>

<script>
async function runOracle(){
    const btn = document.querySelector('.btn-oracle');
    const loader = document.getElementById('loader');
    const result = document.getElementById('resultZone');
    
    loader.style.display = "block";
    result.style.display = "none";
    btn.disabled = true;

    try {
        const response = await fetch("/compare_api", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                option1: document.getElementById('option1').value,
                option2: document.getElementById('option2').value,
                goal: document.getElementById('myWish').value
            })
        });
        const data = await response.json();
        loader.style.display = "none";
        result.style.display = "block";
        btn.disabled = false;
        typeAIResult(data.reply);
    } catch(err) {
        loader.style.display = "none";
        btn.disabled = false;
        document.getElementById("verdictText").innerHTML = "⚠️ Analysis failed.";
    }
}

function typeAIResult(text){
    const box = document.getElementById("verdictText");
    box.innerHTML = "";
    let i = 0;
    function typing(){
        if(i < text.length){
            box.innerHTML += text.charAt(i);
            i++;
            setTimeout(typing, 15);
        }
    }
    typing();
}
</script>
</body>
</html>
